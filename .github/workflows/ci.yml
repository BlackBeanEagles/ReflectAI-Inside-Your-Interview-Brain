# CI for both halves of the app.
#
# Until now the 270 backend tests only ran when someone remembered to run
# them, and the frontend was only ever checked by whoever last ran a build
# locally. Every regression this project has shipped would have been caught
# by one of the four commands below.
#
# No secrets are needed: tests/conftest.py stubs the LLM, and the database
# layer no-ops when DATABASE_URL is unset (services/db.is_enabled), so a
# fork's pull request runs the full suite exactly like a push does.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile and Render's runtime. A version skew here
          # would mean CI green and production broken.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-backend.txt, not requirements.txt: the latter also
        # pulls streamlit/altair/pandas/pyarrow for the legacy frontend,
        # which nothing under test imports and which cost about a minute.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # TEMPORARY diagnostics. Logs and run summaries need a sign-in even on
      # a public repo, but step CONCLUSIONS are public -- so npm's output is
      # captured once and each grep below turns one possible error code into
      # a readable pass/fail. Removed once answered.
      - name: "diag: capture npm ci output"
        continue-on-error: true
        run: npm ci > /tmp/out.log 2>&1 || true

      - name: "diag: log is non-empty"
        continue-on-error: true
        run: test -s /tmp/out.log

      - name: "diag: ebadplatform"
        continue-on-error: true
        run: grep -qi "EBADPLATFORM" /tmp/out.log

      - name: "diag: eusage"
        continue-on-error: true
        run: grep -qi "EUSAGE" /tmp/out.log

      - name: "diag: enotempty"
        continue-on-error: true
        run: grep -qi "ENOTEMPTY" /tmp/out.log

      - name: "diag: ebadengine"
        continue-on-error: true
        run: grep -qi "EBADENGINE" /tmp/out.log

      - name: "diag: eresolve"
        continue-on-error: true
        run: grep -qi "ERESOLVE" /tmp/out.log

      - name: "diag: e404"
        continue-on-error: true
        run: grep -qi "E404" /tmp/out.log

      - name: "diag: eacces"
        continue-on-error: true
        run: grep -qi "EACCES" /tmp/out.log

      - name: "diag: eintegrity"
        continue-on-error: true
        run: grep -qi "EINTEGRITY" /tmp/out.log

      - name: "diag: enospc"
        continue-on-error: true
        run: grep -qi "ENOSPC" /tmp/out.log

      - name: "diag: exit-handler-never-called"
        continue-on-error: true
        run: grep -qi "Exit handler never called" /tmp/out.log

      - name: "diag: cannot-read"
        continue-on-error: true
        run: grep -qi "Cannot read" /tmp/out.log

      - name: "diag: maximum-call-stack"
        continue-on-error: true
        run: grep -qi "Maximum call stack" /tmp/out.log

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      # The build is the real gate. tsc and eslint both pass on plenty of
      # things Next refuses to build -- a client hook in a server component,
      # a bad route export, a page that throws while prerendering.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://reflectinterview-api.onrender.com
